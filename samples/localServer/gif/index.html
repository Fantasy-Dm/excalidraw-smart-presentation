<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>自适应本地视频播放器</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body, html {
			height: 100%;
			width: 100%;
			overflow: hidden;
			background-color: #000;
			font-family: system-ui, -apple-system, sans-serif;
		}

		#player-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
			background: #000;
		}

    #gif {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      background: #000;
    }
	</style>
</head>
<body>
<div id="player-container">
  <img id="gif" alt="" src=""/>
</div>
  <script>
    // 解析URL参数
    function getUrlParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    // 检查URL参数
    const videoParam = getUrlParam('gif');
    if (videoParam) {
        document.querySelector("#gif").src = videoParam;
    }
  </script>
</body>
</html>
